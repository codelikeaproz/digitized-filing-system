# Production (Vesta): backend + MySQL only.
# Frontend is static files in public_html/digifile/ — no frontend container.
services:
  db:
    image: mysql:8.0
    container_name: dfs_mysql
    restart: always
    environment:
      MYSQL_DATABASE: vpaa_digi_file
      MYSQL_USER: dfs_user
      MYSQL_PASSWORD: dfs_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dfs_net

  backend:
    build:
      context: ./backend
    container_name: dfs_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_ENGINE: mysql
      DB_NAME: vpaa_digi_file
      DB_USER: dfs_user
      DB_PASSWORD: dfs_password
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - backend_media:/app/media
    depends_on:
      - db
    networks:
      - dfs_net
      - appscmueduph_internal
    ports:
      - "127.0.0.1:8001:8000"
    command: >
      sh -c "
      until nc -z db 3306; do sleep 2; done;
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "

volumes:
  mysql_data:
  backend_media:

networks:
  dfs_net:
    driver: bridge
  appscmueduph_internal:
    external: true
